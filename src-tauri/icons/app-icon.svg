<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="surface" x1="128" y1="80" x2="896" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102A43"/>
      <stop offset="0.52" stop-color="#071827"/>
      <stop offset="1" stop-color="#040C15"/>
    </linearGradient>
    <linearGradient id="rim" x1="196" y1="116" x2="828" y2="908" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="brand" x1="272" y1="252" x2="770" y2="772" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="signal" x1="342" y1="426" x2="680" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7F8FF"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0EA5E9" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Deep, neutral app tile with enough contrast for every desktop theme. -->
  <rect width="1024" height="1024" rx="224" fill="url(#surface)"/>
  <rect x="18" y="18" width="988" height="988" rx="206" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- The hexagon recalls an industrial device; the open corners read as ports. -->
  <g filter="url(#markShadow)">
    <path
      d="M512 218 752 356v280L512 774 272 636V356L512 218Z"
      fill="#071827"
      fill-opacity="0.72"
      stroke="url(#brand)"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- A compact telemetry pulse: connection in, measurement, connection out. -->
    <path
      d="M336 520h94l54-112 70 208 54-96h80"
      fill="none"
      stroke="url(#signal)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Three restrained status points make the mark feel connected, not decorative. -->
  <circle cx="272" cy="496" r="18" fill="#99F6E4"/>
  <circle cx="752" cy="496" r="18" fill="#93C5FD"/>
  <circle cx="512" cy="218" r="13" fill="#CCFBF1"/>
</svg>
